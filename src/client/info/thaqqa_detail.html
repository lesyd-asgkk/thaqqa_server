<!DOCTYPE html>
<html>

<head>
    <script src="../lib_ex/jquery-3.6.4.min.js"></script>
    <script src="../lib_ex/binarytransport.js"></script>
    <script src="../lib_ex/snap.svg-min.js"></script>
    <meta charset="utf-8">

    <title>０　読み書き </title>
    <link rel="stylesheet" href="style_info.css">
    <!-- <link rel="stylesheet" href="style.css" />-->
    <!-- 適当にcssの勉強してポチポチやれ-->
</head>

<body>
    <div id="storage">
        <svg id="svgField" width="0" height="0" viewBox="-10 0 100 100" style="display: none;">
            <title>V(sol,abig_0)</title>
            <desc>解説</desc>
            <path fill="none" stroke="red" d="M 10,30
                 A 20,20 0,0,1 50,30
                 A 20,20 0,0,1 90,30
                 Q 90,60 50,90
                 Q 10,60 10,30 z" />
        </svg>
    </div>
    <h1>０　読み書き</h1>
    
    <!--
・東果文字は子音字母、母音字母を組み合わせ、さも一文字のように表す特徴を持つ。
・縦書きではさらに続け字となる。
○(字母の解説)
[ここに図]
・中・尾形の母音はtのスペースを譲る字形になる。尾系の音節末tのみ一部別の字形になる。
○(横書きの場合の解説)
・以下の規則で表記。
[ここに図]
○(縦書きの場合の解説)
・原則として、単語頭、単語中、単語尾で字形が決まる。一音節の場合は例外。
・単語中に改行を挟む場合、分断された双方の文字の字形は変化させない。
[ここに図]
○約物
・概ね使われる約物は以下の通り。
[ここに図　文字とその意味]

○フォントでの表記とかその辺
・東果文字は2024年現在、Unicode領域は登録されていない。
・東果文字は複雑なテキスト処理を要求する為に現状、単なる文字データとして東果文字を扱う目処は立っていない。
・svg処理によって東果文字を表記させる技術は確立済。
・なお、フォントや書体により、著しく一見の字形が変わることも考えられる(未観測)

     -->

</body>

<script type="module">
    import * as khhyl from "../lib_js/deps.js"
    //span khhylに関する変換処理
    $(document).ready(async function () {
        await khhyl.Database.load('/server/init.json');
        //この辺コードが見苦しいので共通処理にするの考える
        for (const i of $('div.table#vowel_0')) {
            const vowel = [["abig","a"],["e","e"],["i","i"],["o","o"],["u","u"],["v","v"],["eold","ë(旧)"],["iold","ï(旧)"]]
            const columns = [["sol","単独系"],["init","頭系"],["mid","中系"],["fin","尾系"]];
            const table = document.createElement('table'); 
                const tbody = document.createElement('tbody'); 
                for(let y = -1;y<vowel.length;y++){
                const tr = document.createElement('tr'); 
                for(let x = -1;x<columns.length;x++){
                const td = document.createElement('td');
                td.style.textAlign = "center";
                td.style.verticalAlign = "center";
                const span = document.createElement("span");
                if(x == -1){
                    if(y == -1) span.textContent = "/";
                    else span.textContent = vowel[y][1];
                    }
                else{
                    if(y == -1) span.textContent = columns[x][1];
                    else{
                        span.classList.add("khhyl","larger");
                        span.setAttribute("letter",`S(${columns[x][0]},,${vowel[y][0]}0,)`)
                        }
                    }
                    td.appendChild(span);tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            i.appendChild(table);
        }

        for (const i of $('div.table#consonant_0')) {
            const consonant = [["t","t"],["k","k"],["q","q"],["c","'"],
            ["n","n"],["ng","ng"],
            ["th","th"],["s","s"],["hy","hy"],["kh","kh"],["qh","qh"],["h","h"]
            ,["l","l"],["tl","tl(東)/ts(汽)"],["r","r"],["y","y"],["w","w"]]

            const csy = [["t0-sy","ty(汽)"],["k0-sy","ky(汽)"],,,
            ["n0-sy","ny(汽)"],["ng0-sy","ngy(汽)"],
            ,["s0-sy","sy(汽)"],,,,
            ,,,["r0-sy","ry(汽)"],,]

            const csw = [,["k0-sw","kw(汽)"],["q0-sw","qw(汽)"],,
            ,["ng0-sw","ngw(汽)"],
            ,,,,["qh0-sw","hw(汽)"],
            ,,,,,]

            const cd = [["t0-d","d(汽)"],["k0-d","g(汽)"],,,
            ,,
            ["th0-d","dh"],["s0-d","z"],["hy0-d","zh(東)"],["kh0-d","gh(東)"],["qh0-d","rh(東)"],["h0-d","Hh(東)"]
            ,,,,,]

            const cmisc = [["t0-d0-hd","b(汽)"],,,,
            ["n0-hd0-sy","my(汽)"],,
            ["th0-hd0-sy","hpy(汽)"],["th0-hd0-sw","hp(汽)"],,["s0-d0-sy","zy(汽)"],,
            ,,["tl0-hd0-sy","ch(汽)"],,,]

            const chd = [["t0-hd","p(汽)"],,["q0-hd","hq(汽)"],,
            ["n0-hd","m(汽)"],,
            ["th0-hd","f(汽)"],,,,,
            ,,["tl0-hd","ht(汽)"],,,]

            const columns = [["coda","尾系"],["onset","頭系"],["",""]];
            const row = [consonant,cd,chd,csy,csw,cmisc];
            const shurui = ["/","+濁符(下)","+半濁符(横)","+拗符(横)","+合拗符(下)","+複合"]
            const table = document.createElement('table'); 
                const tbody = document.createElement('tbody'); 
            for(let y = -1;y<consonant.length;y++){
                const tr = document.createElement('tr'); 
            for(let x = -1;x<row.length*3-1;x++){
                const td = document.createElement('td');
                td.style.textAlign = "center";
                td.style.verticalAlign = "center";
                const span = document.createElement("span");
                const x0 = Math.floor((x+1)/3);
                if(x == -1 || x % 3 == 2){
                    if(y == -1) span.textContent = shurui[x0];
                    else if(row[x0][y]!=null) span.textContent = row[x0][y][1];
                    }
                else{
                    if(y == -1) span.textContent = columns[x%3][1];
                    else{
                        if(row[x0][y] != null){
                            span.classList.add("khhyl","larger");
                            span.setAttribute("letter",`C(${columns[x%3][0]},${row[x0][y][0]}0)`)
                            }
                        }
                    }
                    td.appendChild(span);tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            i.appendChild(table);
        }
        for (const i of $('div.table#punctuation_0')) {
            const columns = [["引用符（例としてe\"nehtvnu\"n","S(init,,e0,)S(mid,,br0,)S(mid,n0,e0,h0)S(mid,t0,v1,)S(mid,n0,u0,)S(mid,,br0,)S(fin,,a0,n0)"],["句点","P(comma0)"],["読点","P(period0)"],["スペース","P(space0)"],["省略記号","S(sol,,omit0,)"],["省略記号（中）","S(mid,,omit0,)"],["疑問符","P(question0)"],["感嘆符","P(exclamation0)"]]
            const table = document.createElement('table'); 
                const tbody = document.createElement('tbody'); 
                for(let y = 0;y<2;y++){
                const tr = document.createElement('tr'); 
                for(let x = -1;x<columns.length;x++){
                const td = document.createElement('td');
                td.style.textAlign = "center";
                td.style.verticalAlign = "center";
                const span = document.createElement("span");
                if(x == -1){
                    if(y == 0) span.textContent = "名前";
                    else span.textContent = "表記";
                    }
                else{
                    if(y == 0) span.textContent = columns[x][0];
                    else{
                        span.classList.add("khhyl","larger");
                        span.setAttribute("letter",`${columns[x][1]}`)
                        }
                    }
                    td.appendChild(span);tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            i.appendChild(table);
        }
        for (const i of $('div.table#syllable_tval')) {
            const vowel = [["abig","a"],["e","e"],["i","i"],["o","o"],["u","u"],["v","v"],["eold","ë(旧)"],["iold","ï(旧)"]]
            const columns = [["母","sol","",""],["t+中","mid","t0",""],["t+終","fin","t0",""],["終+t","fin","","t0"],["t+終+t","fin","t0","t0"]];
            const table = document.createElement('table'); 
                const tbody = document.createElement('tbody'); 
                for(let y = -1;y<vowel.length;y++){
                const tr = document.createElement('tr'); 
            for(let x = -1;x<columns.length;x++){
                const td = document.createElement('td');
                td.style.textAlign = "center";
                td.style.verticalAlign = "center";
                const span = document.createElement("span");
                if(x == -1){
                    if(y == -1) span.textContent = "/";
                    else span.textContent = vowel[y][1];
                    }
                else{
                    if(y == -1) span.textContent = columns[x][0];
                    else{
                        span.classList.add("khhyl","larger");
                        span.setAttribute("option","parsed");
                        //span.setAttribute("alig","vert")
                        span.setAttribute("letter",`S(${columns[x][1]},${columns[x][2]},${vowel[y][0]}0,${columns[x][3]})`)
                        }
                    }
                    td.appendChild(span);tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            i.appendChild(table);
        }

        for (const i of $('div.table#syllable_hori')) {
            const vowel = [["abig","a"],["e","e"],["i","i"],["o","o"],["u","u"],["v","v"],["eold","ë(旧)"],["iold","ï(旧)"]]
            const columns = ["V","CV","VC","CVC"];
            const table = document.createElement('table'); 
                const tbody = document.createElement('tbody'); 
                for(let y = -1;y<vowel.length;y++){
                const tr = document.createElement('tr'); 
            for(let x = -1;x<columns.length;x++){
                const td = document.createElement('td');
                td.style.textAlign = "center";
                td.style.verticalAlign = "center";
                const span = document.createElement("span");
                if(x == -1){
                    if(y == -1) span.textContent = "/";
                    else span.textContent = vowel[y][1];
                    }
                else{
                    if(y == -1) span.textContent = columns[x];
                    else{
                        span.classList.add("khhyl","larger");
                        span.setAttribute("option","parsed");
                        span.setAttribute("alig","vert")
                        span.setAttribute("letter",`S(null,${x%2==1?"h0":""},${vowel[y][0]}0,${x%4>=2?"h0":""})`)
                    }
                    }
                    td.appendChild(span);tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            i.appendChild(table);
        }

        for (const i of $('span.khhyl')) {
            const object = $("div#storage svg#svgField").clone(false, false)[0];
            while (object.firstChild) object.removeChild(object.firstChild);
            object.style.display = "block";

            const letter = i.getAttribute("letter").replaceAll("\\n","\n");
            const type = i.getAttribute("option") ?? "parsedplus"
            {
                const title = $("div#storage svg#svgField title").clone()[0];title.textContent = letter;
                const desc = $("div#storage svg#svgField desc").clone()[0];desc.textContent = "解説";
                object.append(title, desc)
            }
            //console.log(parseFloat(getComputedStyle(i).fontSize));
            const d = khhyl.Render.DrawD(letter,parseFloat(getComputedStyle(i).fontSize),0, i.getAttribute("alig") == null ? 0 : 1 , type,null);
            const path = $("div#storage svg#svgField path").clone()[0];
            path.style.display = "block";
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "black");
            path.setAttribute("stroke-width", 0);
            path.setAttribute("fill", "black");
            path.setAttribute("d", d);
            object.appendChild(path);

            const x0 = khhyl.SVG.getLeft(d); const x1 = khhyl.SVG.getRight(d); const y0 = khhyl.SVG.getTop(d); const y1 = khhyl.SVG.getBottom(d);
            const shrink_x = 1.03; const HEIGHT = y1 - y0; const WIDTH = x1 - x0;
            object.setAttribute("width", (WIDTH * shrink_x).toString());
            object.setAttribute("height", (HEIGHT * shrink_x).toString());
            object.setAttribute("viewBox", `${x0-(WIDTH*(shrink_x-1)/2)} ${y0-(HEIGHT*(shrink_x-1))/2} ${WIDTH* shrink_x} ${HEIGHT* shrink_x}`);
            i.appendChild(object);
        }
    });
</script>

</html>
